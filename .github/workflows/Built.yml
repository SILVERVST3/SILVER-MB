name: Build SILVER-MB

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SILVER-MB-VST3-Windows
          path: build/SILVER_MB_artefacts/Release/VST3/SILVER-MB.vst3

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: SILVER-MB-Standalone-Windows
          path: build/SILVER_MB_artefacts/Release/Standalone/SILVER-MB.exe
